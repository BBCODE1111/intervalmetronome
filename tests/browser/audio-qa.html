<!doctype html>
<html lang="en"><meta charset="utf-8"><base href="./"><title>Metronome audio verification</title>
<style>body{font:16px system-ui;margin:24px}pre{white-space:pre-wrap}button{font:inherit;padding:12px}</style>
<h1>Real Web Audio waveform checks</h1>
<p>Uses the production engine, bundled WAV and browser audio renderer. Two channels isolate voice from click.</p>
<button id="run">Run waveform checks</button><pre id="results" role="status">Ready</pre>
<script src="./assets/audio.js"></script><script>
const output = document.getElementById('results');
document.getElementById('run').onclick = async () => {
  output.textContent = 'Running';
  let cases = 0, beats = 0, maxOffset = 0, maxPeak = 0;
  try {
    for (const rate of [44100, 48000]) for (const bpm of [30, 60, 90, 120, 150, 180, 240, 300, 400]) for (const note of [4, 8]) {
      const duration = 60 / bpm * (note === 8 ? .5 : 1);
      const numbers = [1, 2, 3, 4, 5, 7, 17, 21, 101, Number.MAX_SAFE_INTEGER];
      const ctx = new OfflineAudioContext(2, Math.ceil((.1 + duration * numbers.length) * rate), rate);
      const voice = new MetronomeAudio.Engine(ctx), click = new MetronomeAudio.Engine(ctx);
      await voice.ready();
      const merger = ctx.createChannelMerger(2);
      merger.connect(ctx.destination);
      voice.master.disconnect(); voice.master.connect(merger, 0, 0);
      click.master.disconnect(); click.master.connect(merger, 0, 1);
      for (let i = 0; i < numbers.length; i++) {
        const time = .05 + duration * i;
        voice.count(numbers[i], time, duration);
        click.click(time, i === 0, true);
      }
      const rendered = await ctx.startRendering();
      const v = rendered.getChannelData(0), c = rendered.getChannelData(1);
      for (let i = 0; i < numbers.length; i++) {
        const start = Math.round((.05 + duration * i) * rate), end = Math.round((.05 + duration * (i + 1)) * rate);
        const onset = data => { for(let j = Math.max(0, start - 1); j < Math.min(end, data.length); j++) if(Math.abs(data[j]) > .0001) return j; throw new Error('Silent beat'); };
        const offset = Math.abs(onset(v) - onset(c)) / rate * 1000;
        maxOffset = Math.max(maxOffset, offset);
        if (offset > 2) throw new Error(`Voice onset ${offset} ms at ${bpm} BPM /${note}, number ${numbers[i]}, ${rate} Hz`);
        let gapPeak = 0;
        for (let j = Math.ceil(start + duration * rate * .9); j < end - 2; j++) gapPeak = Math.max(gapPeak, Math.abs(v[j]));
        if (gapPeak > .0001) throw new Error(`Voice overlaps next beat at ${bpm} /${note}`);
        for (let j = start; j < end; j++) maxPeak = Math.max(maxPeak, Math.abs(v[j] + c[j]));
        beats++;
      }
      cases++;
      output.textContent = `Running: ${cases}/36 renders, ${beats} spoken beats`;
    }
    // Actual PCM mute and cancellation, not only method-call assertions.
    for (const action of ['mute', 'stop']) {
      const ctx = new OfflineAudioContext(1, 48000, 48000);
      const engine = new MetronomeAudio.Engine(ctx); await engine.ready();
      engine.count(1, .05, .5); engine.click(.05, true, true);
      if(action === 'mute') engine.setVolume(0); else engine.stop();
      const pcm = (await ctx.startRendering()).getChannelData(0);
      if(pcm.some(sample => sample !== 0)) throw new Error(`${action} emitted audio`);
    }
    output.textContent = JSON.stringify({status:'PASS', renders:cases, spokenBeats:beats, maxVoiceClickOnsetDifferenceMs:maxOffset, maxCombinedPeak:maxPeak, mutedPCM:'silent', stoppedPCM:'silent', sampleRates:[44100,48000]}, null, 2);
  } catch(error) { output.textContent = `FAIL: ${error.stack}`; }
};
</script></html>
